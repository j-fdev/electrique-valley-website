# nginx config for Electrique Valley (AWS Lightsail, Ubuntu 24.04)
# Install:   sudo cp deploy/nginx/electriquevalley.conf /etc/nginx/sites-available/electriquevalley
#            sudo ln -sf /etc/nginx/sites-available/electriquevalley /etc/nginx/sites-enabled/electriquevalley
#            sudo nginx -t && sudo systemctl reload nginx
# HTTPS:     certbot adds the "listen 443 ssl" lines and the HTTP -> HTTPS redirects (see deploy/MIGRATION.md).

# HTML pages: always check for a new version. Other files (images...): no header, browser default.
# (An empty value means nginx sends no Cache-Control header.)
map $sent_http_content_type $html_cache_control {
    ~*text/html "no-cache";
    default     "";
}

# ---------- Website: electriquevalley.com + www ----------
server {
    listen 80;
    listen [::]:80;
    server_name electriquevalley.com www.electriquevalley.com;

    # React build (client/build). Kept outside /home/ubuntu so nginx (www-data) can read it.
    root /var/www/electriquevalley;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache them for a year. ^~ = this rule wins over the file rule below.
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be fresh, so a new deploy shows up right away.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A missing file (image, video, script...) is a real 404, not the app page with a 200.
    location ~* .(png|jpe?g|webp|gif|svg|ico|css|js|map|json|xml|txt|woff2?|ttf|mp4|webm|pdf)$ {
        try_files $uri =404;
    }

    # Old addresses (before Nov. 2026) -> new French addresses, permanently (keeps Google ranking and shared links).
    # Same list as client/src/config/routes.json ("legacy"): update both together. $is_args$args keeps ?email=...&token=... on unsubscribe links.
    location = /dmaxSeries { return 301 /serie-dmax$is_args$args; }
    location = /luxorSeries { return 301 /serie-luxor$is_args$args; }
    location = /classicSeries { return 301 /serie-classic$is_args$args; }
    location = /thorSeries { return 301 /serie-thor$is_args$args; }
    location = /videoShowcase { return 301 /videos$is_args$args; }
    location = /contact { return 301 /nous-joindre$is_args$args; }
    location = /privacy { return 301 /confidentialite$is_args$args; }
    location = /termsAndConditions { return 301 /conditions-utilisation$is_args$args; }
    location = /unsubscribe { return 301 /desabonnement$is_args$args; }

    # Each page is pre-rendered to <address>/index.html (client/scripts/prerender.mjs), so Google gets
    # the full text. HTML pages stay fresh after a deploy (see $html_cache_control at the top).
    # Unknown addresses get the empty app shell (app.html), not the home page's text.
    location / {
        add_header Cache-Control $html_cache_control;
        try_files $uri $uri/index.html /app.html;
    }
}

# ---------- API: api.electriquevalley.com -> Express on port 5000 ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.electriquevalley.com;

    # The forms send tiny JSON bodies (Express also limits them to 20 kb).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
