# nginx config for Électrique Valley (AWS Lightsail, Ubuntu 24.04)
# Install:   sudo cp deploy/nginx/electriquevalley.conf /etc/nginx/sites-available/electriquevalley
#            sudo ln -sf /etc/nginx/sites-available/electriquevalley /etc/nginx/sites-enabled/electriquevalley
#            sudo nginx -t && sudo systemctl reload nginx
# HTTPS:     certbot adds the "listen 443 ssl" lines and the HTTP -> HTTPS redirects (see deploy/MIGRATION.md).

# ---------- Website: electriquevalley.com + www ----------
server {
    listen 80;
    listen [::]:80;
    server_name electriquevalley.com www.electriquevalley.com;

    # React build (client/build). Kept outside /home/ubuntu so nginx (www-data) can read it.
    root /var/www/electriquevalley;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache them for a year.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be fresh, so a new deploy shows up right away.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- API: api.electriquevalley.com -> Express on port 5000 ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.electriquevalley.com;

    # The forms send tiny JSON bodies (Express also limits them to 20 kb).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
